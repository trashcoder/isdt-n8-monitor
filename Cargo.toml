[package]
name = "isdt-n8-monitor"
version = "0.1.0"
edition = "2024"
description = "Cross-platform live monitor for the ISDT N8 charger"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hidapi = { version = "2.6.7", features = ["macos-shared-device", "windows-native"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
